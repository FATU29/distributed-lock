# Promtail config — ships container logs from Docker to Loki.

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use compose service name as the "service" label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: "container"
    pipeline_stages:
      # booking-service emits JSON via pino — parse it
      - match:
          selector: '{service="booking-service"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  trace_id: trace_id
                  span_id: span_id
                  pid: pid
            - labels:
                level:
                trace_id:
